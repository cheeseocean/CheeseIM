<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 888" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">CheeseIM service overview</title>
  <desc id="architecture-desc">Seven logical services. Clients use api-server for HTTP control, authcenter for identity and business for domain operations. Realtime messages flow through postoffice, postbox, INGRESS, postmaster, DELIVERY and postman. HISTORY is an asynchronous Mongo history branch. Online delivery returns to the gatewayNode via a Redis node queue; offline push uses external providers. Shared infrastructure is shown separately. Solid arrows are transport or RPC; dashed arrows are queues.</desc>
  <defs>
    <marker id="rpc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="message-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="queue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="online-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .name { font-size: 18px; font-weight: 650; }
      .role { font-size: 13px; fill: #334155; }
      .detail { font-size: 12px; fill: #475569; }
      .label { font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .event-label { fill: #6d28d9; }
      .online-label { font-size: 14px; fill: #0f766e; font-weight: 600; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .control-panel { fill: #f0fdfa; stroke: #ccfbf1; stroke-width: 1; }
      .service { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .control-service { fill: #ffffff; stroke: #0f766e; stroke-width: 1.5; }
      .core { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .resource { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
      .rpc { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#rpc-arrow); }
      .transport { fill: none; stroke: #2563eb; stroke-width: 2; marker-start: url(#message-arrow); marker-end: url(#message-arrow); }
      .send { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#message-arrow); }
      .queue { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#queue-arrow); }
      .online { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#online-arrow); }
      .guide { stroke: #c4b5fd; stroke-width: 1; }
      .number { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1040" height="888" rx="16" fill="#ffffff"/>
  <text class="title" x="32" y="42">CheeseIM</text>
  <text class="subtitle" x="32" y="68">Control plane · message pipeline · delivery &amp; recovery</text>
  <line x1="655" y1="41" x2="689" y2="41" stroke="#475569" stroke-width="2"/>
  <text class="detail" x="699" y="45">Transport / RPC</text>
  <line x1="835" y1="41" x2="869" y2="41" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="detail" x="879" y="45">Async queue</text>

  <!-- 控制面和消息主干分区；共享库不画作可部署服务。 -->
  <rect class="control-panel" x="236" y="106" width="776" height="172" rx="14"/>
  <text class="section" x="260" y="134" fill="#0f766e">HTTP CONTROL PLANE</text>
  <rect class="panel" x="236" y="302" width="776" height="382" rx="14"/>
  <text class="section" x="260" y="330">REALTIME MESSAGE PIPELINE</text>
  <rect class="panel" x="236" y="704" width="776" height="136" rx="14"/>
  <text class="section" x="260" y="731">SHARED RUNTIME · ADAPTERS / LIBRARIES</text>

  <!-- 主要同步调用：HTTP/RPC 与双向长连接。 -->
  <path class="rpc" d="M204 220H220V207H260"/>
  <text class="label" x="231" y="194">HTTP</text>
  <path class="rpc" d="M450 207H500"/>
  <text class="label" x="475" y="193">RPC</text>
  <path class="rpc" d="M355 250V266H871V250"/>
  <rect x="467" y="256" width="290" height="19" rx="4" fill="#f0fdfa"/>
  <text class="label" x="612" y="270">RPC · social / access / sync</text>
  <path class="transport" d="M204 414H260"/>
  <text class="label" x="231" y="396">TCP / WS</text>
  <path class="send" d="M420 414H450"/>
  <text class="label" x="435" y="398">RPC</text>

  <!-- 事件是队列边，不用实线冒充直接服务调用。 -->
  <path class="queue" d="M610 414H640"/>
  <line class="guide" x1="625" y1="353" x2="625" y2="405"/>
  <text class="label event-label" x="625" y="346">INGRESS</text>
  <path class="queue" d="M800 414H830"/>
  <line class="guide" x1="815" y1="353" x2="815" y2="405"/>
  <text class="label event-label" x="815" y="346">DELIVERY</text>
  <path class="online" d="M886 468V510H340V468"/>
  <text class="online-label" x="408" y="498">ONLINE · Redis node queue → gatewayNode</text>
  <!-- 白色衬线表示交叉但不连接，历史与投递是独立分支。 -->
  <path d="M720 493V527" stroke="#f8fafc" stroke-width="9"/>
  <path class="queue" d="M720 468V578"/>
  <rect x="678" y="536" width="84" height="23" rx="5" fill="#f8fafc"/>
  <text class="label event-label" x="720" y="552">HISTORY</text>
  <path class="queue" d="M948 468V578"/>
  <rect x="848" y="536" width="138" height="23" rx="5" fill="#f8fafc"/>
  <text class="label event-label" x="917" y="552">OFFLINE_PUSH</text>

  <!-- 客户端是同一个入口角色，可连接不同的网关实例。 -->
  <rect x="32" y="176" width="172" height="284" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="section" x="52" y="205">CLIENTS</text>
  <text class="name" x="52" y="238">CheeseBox</text>
  <text class="role" x="52" y="262">+ Go SDK</text>
  <text class="role" x="52" y="302">HTTP control</text>
  <text class="role" x="52" y="326">Binary Protobuf</text>
  <text class="detail" x="52" y="432">Local state + cursors</text>

  <!-- 七个实际业务服务。 -->
  <g>
    <rect class="control-service" x="260" y="164" width="190" height="86" rx="10"/>
    <text class="name" x="276" y="194">api-server</text>
    <text class="role" x="276" y="219">HTTP · auth / social / sync</text>
    <text class="detail" x="276" y="240">Controller + Facade</text>
  </g>
  <g>
    <rect class="control-service" x="500" y="164" width="210" height="86" rx="10"/>
    <text class="name" x="516" y="194">authcenter</text>
    <text class="role" x="516" y="219">tokens · sessions · tickets</text>
    <text class="detail" x="516" y="240">Identity verification</text>
  </g>
  <g>
    <rect class="control-service" x="756" y="164" width="230" height="86" rx="10"/>
    <text class="name" x="772" y="194">business</text>
    <text class="role" x="772" y="219">users · groups · conversations</text>
    <text class="detail" x="772" y="240">Access + sync + control events</text>
  </g>
  <g>
    <rect class="service" x="260" y="360" width="160" height="108" rx="10"/>
    <circle cx="278" cy="382" r="11" fill="#2563eb"/><text class="number" x="278" y="386">1</text>
    <text class="name" x="296" y="388">postoffice</text>
    <text class="role" x="276" y="416">TCP / WS gateway</text>
    <text class="detail" x="276" y="442">connections · routes</text>
  </g>
  <g>
    <rect class="service" x="450" y="360" width="160" height="108" rx="10"/>
    <circle cx="468" cy="382" r="11" fill="#2563eb"/><text class="number" x="468" y="386">2</text>
    <text class="name" x="486" y="388">postbox</text>
    <text class="role" x="466" y="416">send + history queries</text>
    <text class="detail" x="466" y="442">permission · inbox</text>
  </g>
  <g>
    <rect class="core" x="640" y="360" width="160" height="108" rx="10"/>
    <circle cx="658" cy="382" r="11" fill="#2563eb"/><text class="number" x="658" y="386">3</text>
    <text class="name" x="676" y="388">postmaster</text>
    <text class="role" x="656" y="416">seq + orchestration</text>
    <text class="detail" x="656" y="442">history · group fanout</text>
  </g>
  <g>
    <rect class="service" x="830" y="360" width="160" height="108" rx="10"/>
    <circle cx="848" cy="382" r="11" fill="#2563eb"/><text class="number" x="848" y="386">4</text>
    <text class="name" x="866" y="388">postman</text>
    <text class="role" x="846" y="416">delivery + vendor push</text>
    <text class="detail" x="846" y="442">route · push policy</text>
  </g>

  <text class="role" x="260" y="554">Group fanout is inside postmaster.</text>
  <text class="detail" x="260" y="580">Normal group: write fanout</text>
  <text class="detail" x="260" y="604">Super group: history + client pull</text>
  <text class="detail" x="260" y="650">Clients recover via HTTP seq / cursor sync.</text>
  <g>
    <rect class="resource" x="640" y="578" width="160" height="88" rx="10"/>
    <text class="name" x="656" y="606">History blocks</text>
    <text class="role" x="656" y="631">MongoDB</text>
    <text class="detail" x="656" y="653">HISTORY consumer</text>
  </g>
  <g>
    <rect class="resource" x="830" y="578" width="160" height="88" rx="10"/>
    <text class="name" x="846" y="606">Push providers</text>
    <text class="role" x="846" y="631">APNs · FCM</text>
    <text class="detail" x="846" y="653">Huawei · Xiaomi · JPush</text>
  </g>

  <!-- 基础设施按用途分开，Kafka/Chronicle不是持久化数据库。 -->
  <g>
    <rect class="resource" x="260" y="748" width="220" height="72" rx="10"/>
    <text class="name" x="276" y="775">Redis</text>
    <text class="detail" x="276" y="800">routes · inbox · seq cache · leases</text>
  </g>
  <g>
    <rect class="resource" x="504" y="748" width="220" height="72" rx="10"/>
    <text class="name" x="520" y="775">Kafka / Chronicle</text>
    <text class="detail" x="520" y="800">QueueAdapter · event topics</text>
  </g>
  <g>
    <rect class="resource" x="748" y="748" width="240" height="72" rx="10"/>
    <text class="name" x="764" y="775">MongoDB</text>
    <text class="detail" x="764" y="800">business · history · control outbox</text>
  </g>
  <text class="detail" x="32" y="868">Logical view · all-in-one: one JVM / Chronicle / injvm · cluster: seven service roles / Kafka / remote Dubbo</text>
</svg>
