<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CheeseIM system architecture</title>
  <desc id="desc">Client access, asynchronous message backbone, delivery recovery, and state infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000"><stop stop-color="#07111F"/><stop offset=".55" stop-color="#0B1728"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="90" y1="0" x2="1510" y2="0"><stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#38BDF8"/></marker>
    <marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2DD4BF"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A78BFA"/></marker>
    <style>
      .title{font:700 42px Inter,Arial,"Noto Sans SC",sans-serif;fill:#F8FAFC}.sub{font:400 16px Inter,Arial,"Noto Sans SC",sans-serif;fill:#94A3B8}.eye{font:700 12px Inter,Arial,sans-serif;fill:#67E8F9;letter-spacing:2.2px}.section{font:700 13px Inter,Arial,"Noto Sans SC",sans-serif;fill:#CBD5E1;letter-spacing:1.6px}.ct{font:700 18px Inter,Arial,"Noto Sans SC",sans-serif;fill:#F8FAFC}.cb{font:400 13px Inter,Arial,"Noto Sans SC",sans-serif;fill:#94A3B8}.small{font:600 12px Inter,Arial,"Noto Sans SC",sans-serif;fill:#CBD5E1}.mono{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#BAE6FD}.panel{fill:#0E1B2C;stroke:#25364C;stroke-width:1.2}.card{fill:#111F32;stroke:#2B3C53;stroke-width:1.2}.cc{fill:#0C2535;stroke:#155E75}.cm{fill:#0C2928;stroke:#0F766E}.cv{fill:#211A39;stroke:#6D4FC2}.ca{fill:#2B2113;stroke:#92400E}.flow{fill:none;stroke-width:2.4}.dash{fill:none;stroke:#52637A;stroke-width:1.5;stroke-dasharray:6 7}.num{font:800 13px Inter,Arial,sans-serif;fill:#06111F}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/><circle cx="1430" cy="80" r="270" fill="#7C3AED" opacity=".05"/><circle cx="130" cy="920" r="280" fill="#0891B2" opacity=".05"/>
  <text class="eye" x="90" y="64">SELF-HOSTED · REALTIME · PROTOBUF</text><text class="title" x="90" y="112">CheeseIM 系统架构</text><text class="sub" x="90" y="143">客户端接入、异步消息主干、可靠控制事件与多节点投递闭环</text><path d="M90 164H1510" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
  <g transform="translate(1272 74)"><rect width="238" height="48" rx="24" fill="#102A38" stroke="#155E75"/><circle cx="26" cy="24" r="6" fill="#2DD4BF" filter="url(#glow)"/><text class="small" x="45" y="29">All-in-one / Cluster Ready</text></g>

  <text class="section" x="90" y="207">01 · CLIENT &amp; ACCESS PLANE</text><rect class="panel" x="90" y="224" width="1420" height="174" rx="20" filter="url(#shadow)"/>
  <g transform="translate(120 258)"><rect class="cc" width="230" height="106" rx="15"/><circle cx="35" cy="32" r="17" fill="#38BDF8"/><path d="M27 27h16v11H27zm4 15h8" stroke="#062334" stroke-width="2"/><text class="ct" x="62" y="37">CheeseBox</text><text class="cb" x="24" y="72">Go TUI · 真实联调客户端</text><text class="cb" x="24" y="92">Cursor / Gap Repair</text></g>
  <path class="flow" d="M350 311H407" stroke="#38BDF8" marker-end="url(#cyan)"/><g transform="translate(420 258)"><rect class="card" width="210" height="106" rx="15"/><text class="ct" x="24" y="37">Go Client SDK</text><text class="cb" x="24" y="70">Auth · Sync · TCP</text><text class="cb" x="24" y="91">Typed client events</text></g>
  <path class="flow" d="M630 286H692" stroke="#38BDF8" marker-end="url(#cyan)"/><path class="flow" d="M630 340H692" stroke="#2DD4BF" marker-end="url(#mint)"/>
  <g transform="translate(705 240)"><rect class="cc" width="310" height="68" rx="14"/><rect x="20" y="17" width="58" height="23" rx="12" fill="#38BDF8"/><text class="num" x="49" y="33" text-anchor="middle">HTTP</text><text class="ct" x="94" y="30">api-server</text><text class="cb" x="94" y="51">登录 · 好友 · 会话 · 增量同步</text></g>
  <g transform="translate(705 324)"><rect class="cm" width="310" height="68" rx="14"/><rect x="20" y="17" width="68" height="23" rx="12" fill="#2DD4BF"/><text class="num" x="54" y="33" text-anchor="middle">TCP/WS</text><text class="ct" x="102" y="30">postoffice</text><text class="cb" x="102" y="51">连接 · 心跳 · 路由 · Protobuf</text></g>
  <path class="dash" d="M1015 275H1076"/><path class="dash" d="M1015 358H1076"/>
  <g transform="translate(1088 240)"><rect class="cv" width="190" height="152" rx="14"/><text class="ct" x="22" y="35">authcenter</text><text class="cb" x="22" y="65">Token / Ticket</text><text class="cb" x="22" y="87">Session / Kickoff</text><path d="M22 106h146" stroke="#6D4FC2"/><text class="mono" x="22" y="132">IDENTITY BOUNDARY</text></g>
  <g transform="translate(1298 240)"><rect class="card" width="182" height="152" rx="14"/><text class="ct" x="22" y="35">business</text><text class="cb" x="22" y="65">用户 · 好友 · 群组</text><text class="cb" x="22" y="87">会话 · 权限策略</text><path d="M22 106h138" stroke="#334155"/><text class="mono" x="22" y="132">DOMAIN SERVICES</text></g>

  <text class="section" x="90" y="446">02 · ASYNC MESSAGE BACKBONE</text><rect class="panel" x="90" y="463" width="1420" height="250" rx="20" filter="url(#shadow)"/><path d="M150 586H1440" stroke="url(#accent)" stroke-width="5" opacity=".16"/>
  <g transform="translate(120 516)"><circle cx="32" cy="70" r="29" fill="#38BDF8"/><text class="num" x="32" y="75" text-anchor="middle">1</text><text class="ct" x="0" y="124">postoffice</text><text class="cb" x="0" y="146">接收 CHAT_MESSAGE</text></g><path class="flow" d="M187 586H291" stroke="#38BDF8" marker-end="url(#cyan)"/>
  <g transform="translate(304 516)"><rect class="cc" width="190" height="140" rx="16"/><circle cx="30" cy="30" r="18" fill="#38BDF8"/><text class="num" x="30" y="35" text-anchor="middle">2</text><text class="ct" x="58" y="36">postbox</text><text class="cb" x="22" y="76">发送权限聚合</text><text class="cb" x="22" y="99">客户端幂等校验</text><text class="mono" x="22" y="125">INGRESS PRODUCER</text></g><path class="flow" d="M494 586H551" stroke="#38BDF8" marker-end="url(#cyan)"/>
  <g transform="translate(564 539)"><rect width="154" height="94" rx="47" fill="#12293A" stroke="#155E75"/><text class="small" x="77" y="39" text-anchor="middle">Ingress Topic</text><text class="mono" x="77" y="64" text-anchor="middle">PROTOBUF BYTES</text></g><path class="flow" d="M718 586H777" stroke="#2DD4BF" marker-end="url(#mint)"/>
  <g transform="translate(790 501)"><rect class="cm" width="230" height="170" rx="16"/><circle cx="30" cy="30" r="18" fill="#2DD4BF"/><text class="num" x="30" y="35" text-anchor="middle">3</text><text class="ct" x="58" y="36">postmaster</text><text class="cb" x="22" y="76">分配 conversation seq</text><text class="cb" x="22" y="99">批量写历史与 mapping</text><text class="cb" x="22" y="122">群成员 Fanout Planning</text><text class="mono" x="22" y="148">ORDERED CORE</text></g><path class="flow" d="M1020 586H1079" stroke="#2DD4BF" marker-end="url(#mint)"/>
  <g transform="translate(1092 539)"><rect width="154" height="94" rx="47" fill="#19243A" stroke="#6D4FC2"/><text class="small" x="77" y="39" text-anchor="middle">Delivery Topic</text><text class="mono" x="77" y="64" text-anchor="middle">KEYED BATCHES</text></g><path class="flow" d="M1246 586H1311" stroke="#A78BFA" marker-end="url(#violet)"/>
  <g transform="translate(1324 516)"><circle cx="32" cy="70" r="29" fill="#A78BFA"/><text class="num" x="32" y="75" text-anchor="middle">4</text><text class="ct" x="0" y="124">postman</text><text class="cb" x="0" y="146">路由投递 / Push</text></g>

  <text class="section" x="90" y="761">03 · DELIVERY, RECOVERY &amp; STATE</text><rect class="panel" x="90" y="778" width="1420" height="174" rx="20" filter="url(#shadow)"/>
  <g transform="translate(120 808)"><rect class="cm" width="248" height="114" rx="15"/><text class="ct" x="22" y="35">Online Delivery</text><text class="cb" x="22" y="65">Node queue → postoffice</text><text class="cb" x="22" y="87">ACK · Delivery · Read</text><circle cx="219" cy="28" r="6" fill="#2DD4BF" filter="url(#glow)"/></g>
  <g transform="translate(390 808)"><rect class="cv" width="244" height="114" rx="15"/><text class="ct" x="22" y="35">Offline Push</text><text class="cb" x="22" y="65">APNs · FCM · Huawei</text><text class="cb" x="22" y="87">Xiaomi · JPush</text></g>
  <g transform="translate(656 808)"><rect class="ca" width="286" height="114" rx="15"/><text class="ct" x="22" y="35">Reliable Control Events</text><text class="cb" x="22" y="65">Read · Revoke · Delivery outbox</text><text class="cb" x="22" y="87">Realtime notify + cursor recovery</text></g>
  <g transform="translate(964 808)"><rect class="card" width="160" height="114" rx="15"/><text class="ct" x="20" y="35">MongoDB</text><text class="cb" x="20" y="65">History blocks</text><text class="cb" x="20" y="87">Business state</text></g>
  <g transform="translate(1146 808)"><rect class="card" width="160" height="114" rx="15"/><text class="ct" x="20" y="35">Redis</text><text class="cb" x="20" y="65">Route · Seq</text><text class="cb" x="20" y="87">Idempotency</text></g>
  <g transform="translate(1328 808)"><rect class="card" width="152" height="114" rx="15"/><text class="ct" x="20" y="35">Queue</text><text class="cb" x="20" y="65">Kafka</text><text class="cb" x="20" y="87">Chronicle</text></g>
  <path class="dash" d="M1356 656V735Q1356 753 1338 753H244Q226 753 226 778V797" marker-end="url(#mint)"/><text class="small" x="1165" y="746">ONLINE ROUTE</text>
  <path class="dash" d="M1390 656V785H512V797" marker-end="url(#violet)"/><text class="small" x="1218" y="780">OFFLINE FALLBACK</text>
  <path class="dash" d="M905 671V797" marker-end="url(#violet)"/><text class="small" x="920" y="744">CONTROL OUTBOX</text>
  <path class="dash" d="M800 808V744H835V713" marker-end="url(#cyan)"/><text class="small" x="650" y="759">HTTP CURSOR CATCH-UP</text>
  <text class="sub" x="90" y="980">Solid arrows = realtime message flow · Dashed arrows = delivery fallback and recovery paths</text><text class="mono" x="1510" y="980" text-anchor="end">message_protocol.proto · SINGLE WIRE CONTRACT</text>
</svg>
