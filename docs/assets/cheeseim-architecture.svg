<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CheeseIM product architecture</title>
  <desc id="desc">A product-oriented architecture diagram showing clients, access channels, core communication capabilities, delivery loop, and data foundation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#123" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="#4B5F7A"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1280" y2="0">
      <stop stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <style>
      .bg { fill: #F7F9FC; }
      .title { font: 700 34px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0F172A; }
      .subtitle { font: 400 16px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .layer-title { font: 700 18px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0F172A; }
      .layer-note { font: 400 13px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748B; }
      .card-title { font: 700 17px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .card-body { font: 400 13px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tag { font: 700 12px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; letter-spacing: 0.3px; }
      .small { font: 400 12px Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748B; }
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.2; filter: url(#shadow); }
      .card { fill: #FFFFFF; stroke: #D8E0EA; stroke-width: 1.1; }
      .muted-card { fill: #F8FAFC; stroke: #D8E0EA; stroke-width: 1.1; }
      .line { stroke: #4B5F7A; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-line { stroke: #9AA8BA; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect x="0" y="0" width="1280" height="10" fill="url(#header)"/>

  <text class="title" x="64" y="66">CheeseIM 产品架构</text>
  <text class="subtitle" x="64" y="96">从用户入口到消息闭环：登录、实时通信、会话同步、在线投递与离线通知</text>

  <g transform="translate(64 128)">
    <rect class="panel" width="1152" height="574" rx="8"/>

    <g transform="translate(30 30)">
      <text class="layer-title" x="0" y="20">1. 使用端</text>
      <text class="layer-note" x="0" y="42">用户真正接触的入口</text>
      <rect class="card" x="170" y="0" width="190" height="70" rx="8"/>
      <text class="card-title" x="194" y="29">CheeseBox TUI</text>
      <text class="card-body" x="194" y="51">终端聊天与联调客户端</text>
      <rect class="card" x="386" y="0" width="190" height="70" rx="8"/>
      <text class="card-title" x="410" y="29">Go SDK</text>
      <text class="card-body" x="410" y="51">可复用客户端能力层</text>
      <rect class="muted-card" x="602" y="0" width="190" height="70" rx="8"/>
      <text class="card-title" x="626" y="29">CheeseWeb</text>
      <text class="card-body" x="626" y="51">Web 客户端实验实现</text>
    </g>

    <g transform="translate(30 130)">
      <text class="layer-title" x="0" y="20">2. 接入体验</text>
      <text class="layer-note" x="0" y="42">把账号会话和实时连接分开处理</text>
      <rect class="card" x="170" y="0" width="300" height="78" rx="8"/>
      <text class="card-title" x="196" y="30">HTTP API</text>
      <text class="card-body" x="196" y="52">登录、ticket、好友、群组、会话同步</text>
      <rect class="card" x="520" y="0" width="300" height="78" rx="8"/>
      <text class="card-title" x="546" y="30">TCP / WebSocket</text>
      <text class="card-body" x="546" y="52">Protobuf 长连接、心跳、实时收发</text>
    </g>

    <g transform="translate(30 238)">
      <text class="layer-title" x="0" y="20">3. 核心能力</text>
      <text class="layer-note" x="0" y="42">支撑 IM 产品体验的业务能力</text>
      <rect class="card" x="170" y="0" width="175" height="74" rx="8"/>
      <text class="card-title" x="194" y="29">身份与会话</text>
      <text class="card-body" x="194" y="51">token、ticket、多端状态</text>
      <rect class="card" x="370" y="0" width="175" height="74" rx="8"/>
      <text class="card-title" x="394" y="29">社交关系</text>
      <text class="card-body" x="394" y="51">好友、黑名单、群成员</text>
      <rect class="card" x="570" y="0" width="175" height="74" rx="8"/>
      <text class="card-title" x="594" y="29">消息发送</text>
      <text class="card-body" x="594" y="51">单聊、群聊、系统通知</text>
      <rect class="card" x="770" y="0" width="175" height="74" rx="8"/>
      <text class="card-title" x="794" y="29">会话同步</text>
      <text class="card-body" x="794" y="51">cursor、seq、read ack</text>
    </g>

    <g transform="translate(30 342)">
      <text class="layer-title" x="0" y="20">4. 消息闭环</text>
      <text class="layer-note" x="0" y="42">实时到达只是入口，最终一致由历史与同步保证</text>
      <rect class="card" x="170" y="0" width="150" height="74" rx="8"/>
      <text class="card-title" x="195" y="29">接入</text>
      <text class="card-body" x="195" y="51">接收客户端消息</text>
      <rect class="card" x="350" y="0" width="150" height="74" rx="8"/>
      <text class="card-title" x="375" y="29">排序</text>
      <text class="card-body" x="375" y="51">分配会话 seq</text>
      <rect class="card" x="530" y="0" width="150" height="74" rx="8"/>
      <text class="card-title" x="555" y="29">历史</text>
      <text class="card-body" x="555" y="51">写入消息块</text>
      <rect class="card" x="710" y="0" width="150" height="74" rx="8"/>
      <text class="card-title" x="735" y="29">在线投递</text>
      <text class="card-body" x="735" y="51">推送到在线端</text>
      <rect class="card" x="890" y="0" width="150" height="74" rx="8"/>
      <text class="card-title" x="915" y="29">离线通知</text>
      <text class="card-body" x="915" y="51">厂商 push 事件</text>
    </g>

    <g transform="translate(30 456)">
      <text class="layer-title" x="0" y="20">5. 数据与基础设施</text>
      <text class="layer-note" x="0" y="42">支撑可靠同步、缓存和队列解耦</text>
      <rect class="card" x="170" y="0" width="210" height="70" rx="8"/>
      <text class="card-title" x="194" y="29">MongoDB</text>
      <text class="card-body" x="194" y="51">用户、关系、会话、历史块</text>
      <rect class="card" x="420" y="0" width="210" height="70" rx="8"/>
      <text class="card-title" x="444" y="29">Redis / RocksDB</text>
      <text class="card-body" x="444" y="51">缓存、在线路由、seq 状态</text>
      <rect class="card" x="670" y="0" width="210" height="70" rx="8"/>
      <text class="card-title" x="694" y="29">Chronicle / Kafka</text>
      <text class="card-body" x="694" y="51">消息接入、历史、投递队列</text>
    </g>

    <line class="line" x1="320" y1="100" x2="320" y2="128"/>
    <line class="line" x1="670" y1="100" x2="670" y2="128"/>
    <line class="line" x1="320" y1="208" x2="258" y2="238"/>
    <line class="line" x1="670" y1="208" x2="658" y2="238"/>
    <line class="soft-line" x1="658" y1="312" x2="245" y2="342"/>
    <line class="line" x1="320" y1="379" x2="348" y2="379"/>
    <line class="line" x1="500" y1="379" x2="528" y2="379"/>
    <line class="line" x1="680" y1="379" x2="708" y2="379"/>
    <line class="line" x1="860" y1="379" x2="888" y2="379"/>
    <line class="soft-line" x1="605" y1="416" x2="605" y2="456"/>
    <line class="soft-line" x1="785" y1="416" x2="775" y2="456"/>

    <g transform="translate(926 512)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#0F766E"/>
      <text class="tag" x="25" y="22">Self-hosted IM</text>
    </g>
  </g>
</svg>
