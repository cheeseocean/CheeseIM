<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cheeseim-architecture-title cheeseim-architecture-desc">
      <title id="cheeseim-architecture-title">CheeseIM 系统架构</title>
      <desc id="cheeseim-architecture-desc">展示客户端经 HTTP 与 Protobuf 长连接进入 CheeseIM，消息通过 postbox、异步队列、postmaster 和 postman 完成排序、持久化、在线投递、离线推送与控制事件恢复。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2563eb"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0f766e"/></marker>
        <style>
          .zone{fill:rgba(15,23,42,.02);stroke:rgba(15,23,42,.12);stroke-width:.8}.zoneMask,.labelMask{fill:#f4f7fb}.zoneText{font:500 8px 'Geist Mono','Noto Sans Mono CJK SC',monospace;letter-spacing:.14em;fill:#64748b}.nodeMask{fill:#f4f7fb}.node{fill:#fff;stroke:#0f172a;stroke-width:1}.nodeInput{fill:rgba(71,85,105,.1);stroke:#64748b}.nodeStore{fill:rgba(15,23,42,.05);stroke:#475569}.nodeFocal{fill:rgba(37,99,235,.08);stroke:#2563eb;stroke-width:1.2}.tag{fill:none;stroke:rgba(15,23,42,.35);stroke-width:.8}.tagAccent{fill:none;stroke:rgba(37,99,235,.55);stroke-width:.8}.tagText{font:500 8px 'Geist Mono','Noto Sans Mono CJK SC',monospace;letter-spacing:.08em;fill:#64748b}.tagTextAccent{font:500 8px 'Geist Mono','Noto Sans Mono CJK SC',monospace;letter-spacing:.08em;fill:#2563eb}.name{font:600 12px 'Geist','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#0f172a}.sub{font:400 8px 'Geist Mono','Noto Sans Mono CJK SC',monospace;fill:#64748b}.edge{fill:none;stroke:#475569;stroke-width:1.2;marker-end:url(#arrow)}.edgeAccent{fill:none;stroke:#2563eb;stroke-width:1.2;marker-end:url(#arrow-accent)}.edgeLink{fill:none;stroke:#0f766e;stroke-width:1.2;marker-end:url(#arrow-link)}.edgeAsync{fill:none;stroke:#475569;stroke-width:1;stroke-dasharray:5 4;marker-end:url(#arrow)}.edgeLabel{font:400 8px 'Geist Mono','Noto Sans Mono CJK SC',monospace;letter-spacing:.06em;fill:#64748b}.aside{font:italic 14px 'Instrument Serif','Noto Serif SC',serif;fill:#475569}.legend{font:500 8px 'Geist Mono','Noto Sans Mono CJK SC',monospace;letter-spacing:.08em;fill:#64748b}
        </style>
      </defs>
      <rect width="1280" height="720" fill="#f4f7fb"/>

      <!-- Zones -->
      <rect class="zone" x="40" y="40" width="360" height="520" rx="8"/><rect class="zoneMask" x="56" y="44" width="112" height="12" rx="2"/><text class="zoneText" x="112" y="53" text-anchor="middle">CLIENT / ACCESS</text>
      <rect class="zone" x="424" y="232" width="560" height="200" rx="8"/><rect class="zoneMask" x="440" y="236" width="112" height="12" rx="2"/><text class="zoneText" x="496" y="245" text-anchor="middle">MESSAGE CORE</text>
      <rect class="zone" x="424" y="456" width="816" height="128" rx="8"/><rect class="zoneMask" x="440" y="460" width="120" height="12" rx="2"/><text class="zoneText" x="500" y="469" text-anchor="middle">DURABLE STATE</text>

      <!-- Connectors: drawn before nodes -->
      <line class="edgeLink" x1="216" y1="152" x2="256" y2="152"/>
      <line class="edgeLink" x1="144" y1="188" x2="144" y2="300"/>
      <line class="edge" x1="232" y1="336" x2="256" y2="336"/>
      <line class="edgeAccent" x1="388" y1="336" x2="452" y2="336"/>
      <line class="edgeAccent" x1="596" y1="336" x2="648" y2="336"/>
      <line class="edgeAccent" x1="808" y1="336" x2="860" y2="336"/>
      <line class="edge" x1="964" y1="336" x2="1040" y2="336"/>
      <line class="edge" x1="728" y1="372" x2="728" y2="496"/>
      <path class="edgeLink" d="M388 152H408Q416 152 416 160V512Q416 520 424 520H552"/>
      <path class="edgeAsync" d="M1120 300V224Q1120 216 1112 216H152Q144 216 144 224V300"/>

      <!-- Label masks stay 8px clear of strokes -->
      <rect class="labelMask" x="220" y="132" width="32" height="12" rx="2"/><text class="edgeLabel" x="236" y="141" text-anchor="middle">HTTP</text>
      <rect class="labelMask" x="152" y="232" width="56" height="12" rx="2"/><text class="edgeLabel" x="180" y="241" text-anchor="middle">PROTOBUF</text>
      <rect class="labelMask" x="396" y="316" width="48" height="12" rx="2"/><text class="edgeLabel" x="420" y="325" text-anchor="middle">SEND</text>
      <rect class="labelMask" x="600" y="316" width="44" height="12" rx="2"/><text class="edgeLabel" x="622" y="325" text-anchor="middle">CONSUME</text>
      <rect class="labelMask" x="812" y="316" width="44" height="12" rx="2"/><text class="edgeLabel" x="834" y="325" text-anchor="middle">PUBLISH</text>
      <rect class="labelMask" x="972" y="316" width="60" height="12" rx="2"/><text class="edgeLabel" x="1002" y="325" text-anchor="middle">DELIVER</text>
      <rect class="labelMask" x="736" y="428" width="44" height="12" rx="2"/><text class="edgeLabel" x="758" y="437" text-anchor="middle">WRITE</text>
      <rect class="labelMask" x="448" y="500" width="92" height="12" rx="2"/><text class="edgeLabel" x="494" y="509" text-anchor="middle">CURSOR SYNC</text>
      <rect class="labelMask" x="568" y="196" width="104" height="12" rx="2"/><text class="edgeLabel" x="620" y="205" text-anchor="middle">ONLINE RETURN</text>

      <!-- Nodes -->
      <g><rect class="nodeMask" x="72" y="116" width="144" height="72" rx="6"/><rect class="nodeInput" x="72" y="116" width="144" height="72" rx="6"/><rect class="tag" x="80" y="124" width="44" height="12" rx="2"/><text class="tagText" x="102" y="133" text-anchor="middle">CLIENT</text><text class="name" x="144" y="153" text-anchor="middle">CheeseBox + SDK</text><text class="sub" x="144" y="172" text-anchor="middle">Go · user cursor</text></g>
      <g><rect class="nodeMask" x="256" y="116" width="132" height="72" rx="6"/><rect class="node" x="256" y="116" width="132" height="72" rx="6"/><rect class="tag" x="264" y="124" width="28" height="12" rx="2"/><text class="tagText" x="278" y="133" text-anchor="middle">API</text><text class="name" x="322" y="153" text-anchor="middle">API Plane</text><text class="sub" x="322" y="172" text-anchor="middle">auth · social · sync</text></g>
      <g><rect class="nodeMask" x="72" y="300" width="160" height="72" rx="6"/><rect class="node" x="72" y="300" width="160" height="72" rx="6"/><rect class="tag" x="80" y="308" width="52" height="12" rx="2"/><text class="tagText" x="106" y="317" text-anchor="middle">GATEWAY</text><text class="name" x="152" y="337" text-anchor="middle">postoffice</text><text class="sub" x="152" y="356" text-anchor="middle">TCP/WS · route</text></g>
      <g><rect class="nodeMask" x="256" y="300" width="132" height="72" rx="6"/><rect class="node" x="256" y="300" width="132" height="72" rx="6"/><rect class="tag" x="264" y="308" width="48" height="12" rx="2"/><text class="tagText" x="288" y="317" text-anchor="middle">INGRESS</text><text class="name" x="322" y="337" text-anchor="middle">postbox</text><text class="sub" x="322" y="356" text-anchor="middle">permission · idem</text></g>
      <g><rect class="nodeMask" x="452" y="300" width="144" height="72" rx="6"/><rect class="nodeStore" x="452" y="300" width="144" height="72" rx="6"/><rect class="tag" x="460" y="308" width="44" height="12" rx="2"/><text class="tagText" x="482" y="317" text-anchor="middle">QUEUE</text><text class="name" x="524" y="337" text-anchor="middle">Ingress Bus</text><text class="sub" x="524" y="356" text-anchor="middle">keyed protobuf</text></g>
      <g><rect class="nodeMask" x="648" y="284" width="160" height="88" rx="6"/><rect class="nodeFocal" x="648" y="284" width="160" height="88" rx="6"/><rect class="tagAccent" x="656" y="292" width="44" height="12" rx="2"/><text class="tagTextAccent" x="678" y="301" text-anchor="middle">CORE</text><text class="name" x="728" y="329" text-anchor="middle">postmaster</text><text class="sub" x="728" y="348" text-anchor="middle">seq · history · fanout</text></g>
      <g><rect class="nodeMask" x="860" y="300" width="104" height="72" rx="6"/><rect class="nodeStore" x="860" y="300" width="104" height="72" rx="6"/><rect class="tag" x="868" y="308" width="44" height="12" rx="2"/><text class="tagText" x="890" y="317" text-anchor="middle">QUEUE</text><text class="name" x="912" y="337" text-anchor="middle">Delivery Bus</text><text class="sub" x="912" y="356" text-anchor="middle">keyed batch</text></g>
      <g><rect class="nodeMask" x="1040" y="284" width="160" height="88" rx="6"/><rect class="node" x="1040" y="284" width="160" height="88" rx="6"/><rect class="tag" x="1048" y="292" width="56" height="12" rx="2"/><text class="tagText" x="1076" y="301" text-anchor="middle">DELIVERY</text><text class="name" x="1120" y="329" text-anchor="middle">postman</text><text class="sub" x="1120" y="348" text-anchor="middle">online route · vendor push</text></g>
      <g><rect class="nodeMask" x="552" y="496" width="560" height="48" rx="6"/><rect class="nodeStore" x="552" y="496" width="560" height="48" rx="6"/><rect class="tag" x="560" y="504" width="40" height="12" rx="2"/><text class="tagText" x="580" y="513" text-anchor="middle">STATE</text><text class="name" x="832" y="517" text-anchor="middle">MongoDB · Redis · Kafka / Chronicle</text><text class="sub" x="832" y="536" text-anchor="middle">history · route · seq · idempotency · control-event outbox</text></g>

      <text class="aside" x="48" y="620">One ordered core, two delivery outcomes, one recoverable truth.</text>
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(15,23,42,.12)" stroke-width=".8"/>
      <text class="legend" x="40" y="676">LEGEND</text><line x1="120" y1="672" x2="156" y2="672" stroke="#2563eb" stroke-width="1.2"/><text class="legend" x="168" y="676">PRIMARY MESSAGE FLOW</text><line x1="344" y1="672" x2="380" y2="672" stroke="#0f766e" stroke-width="1.2"/><text class="legend" x="392" y="676">HTTP / SYNC</text><line x1="520" y1="672" x2="556" y2="672" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/><text class="legend" x="568" y="676">ASYNC RETURN</text><rect x="736" y="664" width="20" height="12" rx="2" fill="rgba(37,99,235,.08)" stroke="#2563eb"/><text class="legend" x="768" y="676">FOCAL CORE</text><text class="legend" x="1240" y="676" text-anchor="end">message_protocol.proto · SINGLE WIRE CONTRACT</text>
    </svg>
