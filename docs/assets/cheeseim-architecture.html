<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheeseIM 架构图预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #f1f5f9; color: #0f172a; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1040px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #475569; }
    .diagram { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 16px; background: white; }
    img { display: block; width: 100%; min-width: 720px; }
    a { color: #1d4ed8; }
    code { font-size: 0.9em; }
    .notes { margin-top: 24px; }
    @media (max-width: 600px) { body { padding: 16px 12px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>CheeseIM 服务总览</h1>
    <p>实线：传输 / RPC；虚线：异步队列。图示为逻辑服务视图，单 JVM 联调与独立服务部署共用这些角色。</p>
    <div class="diagram">
      <img src="cheeseim-architecture.svg" alt="CheeseIM HTTP 控制面、消息主干、定向在线投递、异步历史与外部推送架构图">
    </div>
    <div class="notes">
      <p><a href="cheeseim-architecture.svg">打开 SVG 原图</a> · <a href="../../README.md">中文 README</a> · <a href="../../README.en.md">English README</a></p>
      <p>SVG 是唯一图源，本页直接引用它，无需导出步骤、联网字体或脚本。窄屏可横向滚动。README 内另有可展开的消息时序图，用于说明入队 ACK、异步历史和在线投递的不同完成时点。</p>
      <p>为避免主图变成完整调用网，辅助鉴权 / 权限 RPC、投递结果、控制事件补偿的全部连线没有展开；详细边界见 <a href="../../server/docs/architecture/ASSESSMENT.md">架构评估</a> 与 <a href="../PROTOCOL.md">协议说明</a>。</p>
    </div>
  </main>
</body>
</html>
