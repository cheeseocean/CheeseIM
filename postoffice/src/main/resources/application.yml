server:
  port: 8080

spring:
  application:
    name: cheese-im-postoffice

  data:
    redis:
      host: ${redis.host:localhost}
      port: 6379
      password: ${redis.password:}
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers:localhost:9092}
    consumer:
      group-id: postoffice-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval: 1000ms

# CheeseIM配置
cheese:
  im:
    server:
      port: 8080
      boss-threads: 1
      worker-threads: 0
      idle-timeout: 300
    security:
      jwt-secret: "CheeseIM2024Secret!"
      token-expiration: 86400000  # 24小时

# Dubbo配置
dubbo:
  application:
    name: cheese-im-postoffice
    register-mode: instance
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://localhost:8848
  config-center:
    address: nacos://localhost:8848

# 日志配置
logging:
  level:
    com.cheeseocean.im.postoffice: INFO
    io.netty: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"