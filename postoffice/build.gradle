dependencies {
    implementation project(':common')
    implementation project(':postbox')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Netty for WebSocket
    implementation 'io.netty:netty-all:4.1.100.Final'

    // RPC框架 (Dubbo)
    implementation 'org.apache.dubbo:dubbo-spring-boot-starter:3.1.0'
    implementation 'org.apache.dubbo:dubbo-registry-nacos:3.1.0'

    // JSON处理
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 工具类
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'cn.hutool:hutool-all:5.8.10'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.6'
    testImplementation project(':postman')
    testImplementation project(':push')
    testRuntimeOnly 'ch.qos.logback:logback-core:1.5.3'
}
