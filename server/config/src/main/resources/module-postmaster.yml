spring:
  application:
    name: cheese-im-postmaster
  data:
    mongodb:
      uri: ${POSTMASTER_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/cheese_im}}
    redis:
      database: 0
  kafka:
    consumer:
      group-id: postmaster-ingress-group

cheeseim:
  message-mutation:
    revoke-window-seconds: ${CHEESEIM_MESSAGE_REVOKE_WINDOW_SECONDS:120}
  typing:
    default-ttl-seconds: ${CHEESEIM_TYPING_DEFAULT_TTL_SECONDS:4}
    max-normal-group-members: ${CHEESEIM_TYPING_MAX_NORMAL_GROUP_MEMBERS:100}
  delivery:
    group-fanout:
      batch-size: ${CHEESEIM_DELIVERY_GROUP_FANOUT_BATCH_SIZE:500}

logging:
  level:
    com.cheeseocean.im.postmaster: INFO
    org.springframework.data.mongodb: WARN
