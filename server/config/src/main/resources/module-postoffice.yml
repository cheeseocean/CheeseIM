spring:
  application:
    name: cheese-im-postoffice
  data:
    redis:
      database: 1

cheeseim:
  postoffice:
    # 节点唯一标识。留空则自动生成 UUID。生产环境建议设为 hostname 或 k8s pod name。
    node-id: ${CHEESEIM_POSTOFFICE_NODE_ID:}
    websocket:
      enabled: true
      port: 5147
      path: "/ws"
      ssl:
        enabled: false
        cert-path: ""
        key-path: ""
    tcp:
      enabled: true
      port: 5148
      ssl:
        enabled: false
        cert-path: ""
        key-path: ""
    connection:
      multiLoginStrategy: SAME_TERMINAL_KICK
      timeoutMs: 300000
      maxConnectionsPerUser: 10
    business:
      threads: ${CHEESEIM_POSTOFFICE_BUSINESS_THREADS:0}
      queue-capacity: ${CHEESEIM_POSTOFFICE_BUSINESS_QUEUE_CAPACITY:20000}
    security:
      jwtSecret: "CheeseIM2024Secret!CheeseIM2024Secret!"
      tokenExpiration: 86400000

logging:
  level:
    com.cheeseocean.im.postoffice: INFO
