cheeseim:
  runtime:
    mode: standalone
  queue:
    consumer:
      # max-attempts 包含首次调用；Kafka 与 Chronicle 使用相同的总次数语义。
      max-attempts: ${CHEESEIM_QUEUE_CONSUMER_MAX_ATTEMPTS:3}
      retry-interval-millis: ${CHEESEIM_QUEUE_CONSUMER_RETRY_INTERVAL_MILLIS:1000}

server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${CHEESEIM_SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:cheese-im}

dubbo:
  application:
    register-mode: instance
  protocol:
    name: dubbo
    port: -1
  consumer:
    check: false
    timeout: 5000
    retries: 2

# Logging is configured centrally in logback-spring.xml (config module).
# Pattern, file appenders, and noise suppression are all handled there.
