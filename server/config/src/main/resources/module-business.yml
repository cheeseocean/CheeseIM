spring:
  application:
    name: cheese-im-business
  data:
    mongodb:
      host: ${mongodb.host:localhost}
      port: ${mongodb.port:27017}
      database: ${mongodb.database:cheese_im}
    redis:
      database: 0

server:
  port: 18085

management:
  server:
    port: ${CHEESEIM_BUSINESS_MANAGEMENT_PORT:19085}
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,mongo,redis

logging:
  level:
    com.cheeseocean.im.business: INFO
