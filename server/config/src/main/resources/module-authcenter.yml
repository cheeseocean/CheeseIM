spring:
  application:
    name: cheese-im-authcenter
  data:
    mongodb:
      uri: ${AUTHCENTER_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/cheese_im}}

app:
  modules:
    authcenter:
      enabled: true

cheeseim:
  authcenter:
    security:
      jwtSecret: "CheeseIM2024Secret!CheeseIM2024Secret!"
      tokenExpiration: 86400000
    wsTicket:
      ttlMs: 60000
