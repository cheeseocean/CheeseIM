spring:
  application:
    name: cheese-im-postman
  data:
    redis:
      database: 0
  kafka:
    consumer:
      group-id: postman-delivery-group
      max-poll-records: 100
      fetch-min-size: 1
      fetch-max-wait: 500ms
    listener:
      concurrency: 3
      ack-mode: manual_immediate

cheeseim:
  push:
    apns:
      enabled: ${CHEESEIM_PUSH_APNS_ENABLED:false}
      key-path: ${CHEESEIM_PUSH_APNS_KEY_PATH:}
      key-id: ${CHEESEIM_PUSH_APNS_KEY_ID:}
      team-id: ${CHEESEIM_PUSH_APNS_TEAM_ID:}
      bundle-id: ${CHEESEIM_PUSH_APNS_BUNDLE_ID:}
      production: ${CHEESEIM_PUSH_APNS_PRODUCTION:true}
    jpush:
      enabled: ${CHEESEIM_PUSH_JPUSH_ENABLED:false}
      app-key: ${CHEESEIM_PUSH_JPUSH_APP_KEY:}
      master-secret: ${CHEESEIM_PUSH_JPUSH_MASTER_SECRET:}
      production: ${CHEESEIM_PUSH_JPUSH_PRODUCTION:true}
      time-to-live: 86400
    fcm:
      enabled: ${CHEESEIM_PUSH_FCM_ENABLED:false}
      service-account-key: ${CHEESEIM_PUSH_FCM_SERVICE_ACCOUNT_KEY:}
      project-id: ${CHEESEIM_PUSH_FCM_PROJECT_ID:}
    huawei:
      enabled: ${CHEESEIM_PUSH_HUAWEI_ENABLED:false}
      app-id: ${CHEESEIM_PUSH_HUAWEI_APP_ID:}
      app-secret: ${CHEESEIM_PUSH_HUAWEI_APP_SECRET:}
    xiaomi:
      enabled: ${CHEESEIM_PUSH_XIAOMI_ENABLED:false}
      app-secret: ${CHEESEIM_PUSH_XIAOMI_APP_SECRET:}
      package-name: ${CHEESEIM_PUSH_XIAOMI_PACKAGE_NAME:}
    device-token:
      cache-expire-days: 30
      cleanup-interval-hours: 6
    scheduled-tasks:
      enabled: true
      device-token-cleanup-interval-hours: 6
  push-state:
    ttl-seconds: ${CHEESEIM_PUSH_STATE_TTL_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: CheeseIM Postman
    description: Online and Offline Push Service
    version: 1.0.0
    author: CheeseIM Team
logging:
  level:
    com.cheeseocean.im.postman: INFO
