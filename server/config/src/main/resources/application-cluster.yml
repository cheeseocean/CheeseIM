cheeseim:
  runtime:
    mode: cluster
  queue:
    type: ${CHEESEIM_QUEUE_TYPE:kafka}
    kafka:
      # 可显式设为包含 pod/节点唯一部分的前缀；留空时代码生成随机实例 ID，避免 producer fencing。
      transaction-id-prefix: ${KAFKA_TRANSACTION_ID_PREFIX:}
      topics:
        # 生产默认由基础设施 migration 预创建；应用仍会在启动时强校验实际契约。
        auto-create-enabled: ${KAFKA_TOPICS_AUTO_CREATE_ENABLED:false}
        partitions: ${KAFKA_TOPIC_PARTITIONS:12}
        replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:3}
        retention-ms: ${KAFKA_TOPIC_RETENTION_MS:604800000}
        min-in-sync-replicas: ${KAFKA_TOPIC_MIN_ISR:2}
    dlt:
      operations:
        max-query-records: ${CHEESEIM_DLT_MAX_QUERY_RECORDS:100}
        poll-timeout-millis: ${CHEESEIM_DLT_POLL_TIMEOUT_MILLIS:3000}
        lease-millis: ${CHEESEIM_DLT_OPERATION_LEASE_MILLIS:60000}
  conversation-seq:
    deployment-mode: cluster

spring:
  config:
    activate:
      on-profile: cluster
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:32}
          min-idle: ${REDIS_POOL_MIN_IDLE:8}
          max-wait: ${REDIS_POOL_MAX_WAIT:3000ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
      linger-ms: ${KAFKA_PRODUCER_LINGER_MS:1}
      buffer-memory: ${KAFKA_PRODUCER_BUFFER_MEMORY:33554432}
    consumer:
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:latest}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}

dubbo:
  registry:
    address: nacos://${NACOS_SERVER_ADDR}
    register: true
    subscribe: true
    parameters:
      namespace: ${NACOS_NAMESPACE}
      group: ${NACOS_GROUP:DEFAULT_GROUP}
  config-center:
    address: nacos://${NACOS_SERVER_ADDR}
    namespace: ${NACOS_NAMESPACE}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
  metadata-report:
    address: nacos://${NACOS_SERVER_ADDR}
    parameters:
      namespace: ${NACOS_NAMESPACE}
      group: ${NACOS_GROUP:DEFAULT_GROUP}
  protocol:
    name: dubbo
    injvm: false
  consumer:
    injvm: false

---
spring:
  config:
    activate:
      on-profile: redis-sentinel
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER}
        nodes: ${REDIS_SENTINEL_NODES}
        password: ${REDIS_SENTINEL_PASSWORD:${REDIS_PASSWORD:}}

---
spring:
  config:
    activate:
      on-profile: redis-cluster
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:5}
