spring:
  application:
    name: cheese-im-postbox
  data:
    mongodb:
      host: ${mongodb.host:localhost}
      port: ${mongodb.port:27017}
      database: ${mongodb.database:cheese_im}
    redis:
      database: 0
server:
  port: -1

management:
  server:
    port: ${CHEESEIM_POSTBOX_MANAGEMENT_PORT:19082}
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,mongo,redis

cheeseim:
  message-send-inbox:
    ttl-seconds: ${CHEESEIM_MESSAGE_SEND_INBOX_TTL_SECONDS:604800}
    lease-seconds: ${CHEESEIM_MESSAGE_SEND_INBOX_LEASE_SECONDS:30}

info:
  app:
    name: CheeseIM Postbox
    description: Message Routing and Store Service
    version: 1.0.0
    author: CheeseIM Team

logging:
  level:
    com.cheeseocean.im.postbox: INFO
