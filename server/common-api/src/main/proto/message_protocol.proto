syntax = "proto3";

package cheeseim.protocol;

option java_multiple_files = true;
option java_package = "com.cheeseocean.im.common.api.protocol.proto";
option java_outer_classname = "MessageProtocolProto";

message ProtoMessageOptions {
  optional bool need_history = 1;
  optional bool need_conversation = 2;
  optional bool need_unread_count = 3;
  optional bool need_online_push = 4;
  optional bool need_offline_push = 5;
  optional bool sender_sync = 6;
  optional bool notification = 7;
  optional bool need_last_message = 8;
}

message ProtoOfflinePushInfo {
  string title = 1;
  string desc = 2;
  string ex = 3;
  string ios_push_sound = 4;
  optional bool ios_badge_count = 5;
  string signal_info = 6;
  map<string, string> push_extras = 7;
}

message ProtoMessage {
  string client_msg_id = 1;
  string server_msg_id = 2;
  string sender_id = 3;
  string receiver_id = 4;
  string group_id = 5;
  bytes content = 6;
  int32 content_type = 7;
  int32 chat_type = 8;
  int64 send_time = 9;
  int64 create_time = 10;
  int32 status = 11;
  int32 platform_code = 12;
  map<string, string> attributes = 13;
  string unique_id = 14;
  int32 source = 15;
  ProtoMessageOptions options = 16;
  int64 seq = 17;
  ProtoOfflinePushInfo offline_push_info = 18;
}

message ProtoHistoryEvent {
  string conversation_id = 1;
  int64 last_max_seq = 2;
  int64 begin_seq = 3;
  int64 end_seq = 4;
  repeated ProtoMessage messages = 5;
}

message ProtoOfflinePushEvent {
  string user_id = 1;
  string conversation_id = 2;
  int64 seq = 3;
  string server_msg_id = 4;
  string sender_id = 5;
  int32 session_type = 6;
  int32 content_type = 7;
  bool notification = 8;
  string title = 9;
  string content = 10;
  map<string, string> attributes = 11;
}

// HTTP 控制面的跨语言稳定模型。HTTP 仍可使用 JSON 编码，但字段语义只在本 proto 定义。
message ProtoFriend {
  string id = 1;
  string user_id = 2;
  string friend_id = 3;
  string remark = 4;
  int32 add_source = 5;
  string operator_id = 6;
  bool pinned = 7;
  string ex = 8;
  int64 created_at = 9;
}

message ProtoFriendRequest {
  string from_user_id = 1;
  string to_user_id = 2;
  string req_msg = 3;
  int32 handle_result = 4;
  string handle_msg = 5;
  string handler_user_id = 6;
  int64 handle_time = 7;
  string ex = 8;
  int64 create_time = 9;
  int64 updated_at = 10;
}

message ProtoSendFriendRequestCommand {
  string friend_user_id = 1;
  string request_message = 2;
}

message ProtoHandleFriendRequestCommand {
  string friend_user_id = 1;
}

message ProtoGroupSummary {
  string group_id = 1;
  string group_name = 2;
  string avatar_url = 3;
}

message ProtoConversation {
  string owner_user_id = 1;
  string conversation_id = 2;
  int32 conversation_type = 3;
  string target_id = 4;
  int32 receive_opt = 5;
  int64 unread_count = 6;
  bool pinned = 7;
  string attached_info = 8;
  int32 group_at_type = 9;
  bool auto_cleanup = 10;
  int64 cleanup_cycle = 11;
  int64 latest_cleanup_time = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  string kind = 15;
  string title = 16;
  string subtitle = 17;
  string last_message_preview = 18;
  string last_message_preview_type = 19;
  int64 last_message_time = 20;
  bool notification = 21;
}

message ProtoConversationSyncCursor {
  string version_id = 1;
  int64 version = 2;
  int64 id_hash = 3;
}

message ProtoConversationSyncResult {
  string version_id = 1;
  int64 version = 2;
  int64 id_hash = 3;
  bool full = 4;
  repeated ProtoConversation insert = 5;
  repeated ProtoConversation update = 6;
  repeated string delete = 7;
  repeated string read_state_changed_conversation_ids = 8;
}

message ProtoConversationCommand {
  string conversation_id = 1;
  int32 conversation_type = 2;
  string target_id = 3;
  optional int32 recv_msg_opt = 4;
  optional bool pinned = 5;
  optional string draft_text = 6;
  optional string attached_info = 7;
}

message ProtoAuthRequest {
  string ticket = 1;
}

message ProtoAuthResponse {
  string user_id = 1;
  string message = 2;
}

message ProtoConnectResponse {
  string conn_id = 1;
  string message = 2;
}

message ProtoHeartbeatResponse {
  string message = 1;
}

message ProtoErrorResponse {
  int32 code = 1;
  string message = 2;
}

message ProtoChatSendAck {
  string server_msg_id = 1;
  string client_msg_id = 2;
  int64 send_time = 3;
  int64 accepted_at = 4;
  ProtoChatSendAcceptedState accepted_state = 5;
}

enum ProtoChatSendAcceptedState {
  CHAT_SEND_ACCEPTED_STATE_UNSPECIFIED = 0;
  CHAT_SEND_BROKER_ACCEPTED = 1;
}

// 客户端按设备、会话批量确认已实际接收的最大消息序号，不逐消息写状态。
message ProtoChatDeliveryAckCommand {
  string conversation_id = 1;
  int64 max_delivered_seq = 2;
  string device_id = 3;
  string op_id = 4;
}

// delivery 高水位变化通知；单聊发送者据此派生 seq <= delivered_seq 的消息已送达。
message ProtoChatDeliveryNotify {
  string conversation_id = 1;
  string recipient_id = 2;
  string device_id = 3;
  int64 delivered_seq = 4;
  int64 updated_at = 5;
}

// 会话已读高水位命令。业务处理尚未启用时，网关必须拒绝 CHAT_READ。
message ProtoChatReadCommand {
  string conversation_id = 1;
  int64 read_seq = 2;
  string device_id = 3;
  string op_id = 4;
}

// 已读状态变更通知，单聊可通知对端，群聊第一阶段仅同步阅读者自身设备。
message ProtoChatReadNotify {
  string conversation_id = 1;
  string reader_id = 2;
  int64 read_seq = 3;
  int64 updated_at = 4;
}

// 撤回命令。server_msg_id 定位历史消息，conversation_id 防止跨会话误操作。
message ProtoChatRevokeCommand {
  string conversation_id = 1;
  string server_msg_id = 2;
  string op_id = 3;
  string reason = 4;
}

// 撤回 mutation 通知，不作为普通聊天消息写入历史块。
message ProtoChatRevokeNotify {
  string conversation_id = 1;
  string server_msg_id = 2;
  string operator_user_id = 3;
  string operator_name = 4;
  string target_sender_id = 5;
  string target_sender_name = 6;
  int64 revoked_at = 7;
  int64 mutation_version = 8;
}

// 输入中是短生命周期控制信号，不生成普通消息、seq 或历史记录。
message ProtoChatTypingCommand {
  string conversation_id = 1;
  int32 action = 2;
  int32 ttl_seconds = 3;
}

// 输入中通知。START 的 expires_at 由服务端计算，客户端到期后必须自行隐藏状态。
message ProtoChatTypingNotify {
  string conversation_id = 1;
  string sender_id = 2;
  int32 action = 3;
  int64 expires_at = 4;
}

// 强制下线通知。reason 面向用户展示，session/device 用于客户端精确清理本地状态。
message ProtoForceLogoutNotify {
  string reason = 1;
  string session_id = 2;
  string device_id = 3;
  int64 occurred_at = 4;
}

message ProtoClientEnvelope {
  int32 command = 1;
  string request_id = 2;
  oneof payload {
    ProtoAuthRequest auth = 10;
    ProtoMessage chat_message = 11;
    ProtoChatReadCommand chat_read = 12;
    ProtoChatRevokeCommand chat_revoke = 13;
    ProtoChatTypingCommand chat_typing = 14;
    ProtoChatDeliveryAckCommand chat_delivery_ack = 15;
  }
}

message ProtoServerEnvelope {
  int32 command = 1;
  string request_id = 2;
  oneof payload {
    ProtoConnectResponse connect = 9;
    ProtoAuthResponse auth = 10;
    ProtoHeartbeatResponse heartbeat = 11;
    ProtoChatSendAck chat_send_ack = 12;
    ProtoMessage chat_message = 13;
    ProtoErrorResponse error = 14;
    ProtoChatReadNotify chat_read_notify = 15;
    ProtoChatRevokeNotify chat_revoke_notify = 16;
    ProtoForceLogoutNotify force_logout = 17;
    ProtoChatTypingNotify chat_typing_notify = 18;
    ProtoChatDeliveryNotify chat_delivery_notify = 19;
  }
}
