plugins {
    id 'java'
    id 'maven-publish'
    id 'org.graalvm.buildtools.native' version '0.10.1'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
    id 'com.google.protobuf' version '0.9.4' apply false
}

allprojects {
    group = project.findProperty('group') ?: 'com.cheeseocean.im'
    version = project.findProperty('version') ?: '1.0.0'
}

ext {
    chronicleJvmArgs = [
            '-Dchronicle.analytics.disable=true',
            '--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.math=ALL-UNNAMED'
    ]
}

def historyBoundarySources = files(
        fileTree('common-api/src/main/java') { include '**/*.java' },
        fileTree('common-core/src/main/java/com/cheeseocean/im/common/core/history/model') { include '**/*.java' },
        fileTree('common-core/src/main/java') { include '**/*.java' },
        fileTree('postbox/src/main/java') { include '**/*.java' },
        fileTree('postmaster/src/main/java') { include '**/*.java' },
        fileTree('business/src/main/java') { include '**/*.java' }
)

tasks.register('verifyHistoryArchitectureBoundary') {
    group = 'verification'
    description = '拒绝 history model/feature 泄漏 Mongo Document、BSON 或形成 storage-history 反向依赖。'
    inputs.files(historyBoundarySources)
    doLast {
        def violations = []
        fileTree('common-api/src/main/java') { include '**/*.java' }.each { source ->
            if (source.text.contains('org.springframework.data.')) {
                violations << "common-api depends on Spring Data: ${source}"
            }
        }
        fileTree('common-core/src/main/java/com/cheeseocean/im/common/core/history/model') {
            include '**/*.java'
        }.each { source ->
            if (source.text.contains('org.springframework.data.') || source.text.contains('org.bson.')) {
                violations << "history model depends on persistence technology: ${source}"
            }
        }
        ['postbox', 'postmaster', 'business'].each { moduleName ->
            fileTree("${moduleName}/src/main/java") { include '**/*.java' }.each { source ->
                def text = source.text
                if (text.contains('history.mongo.document')
                        || text.contains('common.core.history.document')
                        || text.contains('org.bson.')) {
                    violations << "feature leaks history persistence type: ${source}"
                }
            }
        }
        fileTree('common-core/src/main/java') { include '**/*.java' }.each { source ->
            if (source.text.contains('com.cheeseocean.im.storage.history.')) {
                violations << "common-core depends back on storage-history: ${source}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(violations.join(System.lineSeparator()))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyHistoryArchitectureBoundary')
}

def queueBoundarySources = files(
        fileTree('common-core/src') { include '**/*.java' },
        fileTree('infra-queue/src/main/java') { include '**/*.java' },
        fileTree('postoffice/src/main/java') { include '**/*.java' },
        fileTree('postbox/src/main/java') { include '**/*.java' },
        fileTree('postmaster/src/main/java') { include '**/*.java' },
        fileTree('postman/src/main/java') { include '**/*.java' },
        fileTree('business/src/main/java') { include '**/*.java' }
)

tasks.register('verifyQueueArchitectureBoundary') {
    group = 'verification'
    description = '拒绝 common-core/feature 依赖 Kafka、Chronicle 或 infra-queue 实现。'
    inputs.files(queueBoundarySources)
    doLast {
        def violations = []
        fileTree('common-core/src') { include '**/*.java' }.each { source ->
            def text = source.text
            if (text.contains('org.springframework.kafka.')
                    || text.contains('org.apache.kafka.')
                    || text.contains('net.openhft.chronicle.')
                    || text.contains('com.cheeseocean.im.infra.queue.')) {
                violations << "common-core depends on queue implementation: ${source}"
            }
        }
        ['postoffice', 'postbox', 'postmaster', 'postman', 'business'].each { moduleName ->
            fileTree("${moduleName}/src/main/java") { include '**/*.java' }.each { source ->
                if (source.text.contains('com.cheeseocean.im.infra.queue.')) {
                    violations << "feature imports queue implementation: ${source}"
                }
            }
        }
        fileTree('infra-queue/src/main/java') { include '**/*.java' }.each { source ->
            if (source.text.contains('com.cheeseocean.im.postoffice.')
                    || source.text.contains('com.cheeseocean.im.postbox.')
                    || source.text.contains('com.cheeseocean.im.postmaster.')
                    || source.text.contains('com.cheeseocean.im.postman.')
                    || source.text.contains('com.cheeseocean.im.business.')) {
                violations << "infra-queue depends back on feature: ${source}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(violations.join(System.lineSeparator()))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyQueueArchitectureBoundary')
}

def businessStorageBoundarySources = files(
        fileTree('common-core/src') { include '**/*.java' },
        fileTree('storage-business/src/main/java') { include '**/*.java' },
        fileTree('authcenter/src/main/java') { include '**/*.java' },
        fileTree('business/src/main/java') { include '**/*.java' },
        fileTree('postmaster/src/main/java') { include '**/*.java' },
        fileTree('postman/src/main/java') { include '**/*.java' }
)

tasks.register('verifyBusinessStorageArchitectureBoundary') {
    group = 'verification'
    description = '拒绝 common-core/feature 泄漏 business Mongo adapter、Document 或形成反向依赖。'
    inputs.files(businessStorageBoundarySources)
    doLast {
        def violations = []
        fileTree('common-core/src') { include '**/*.java' }.each { source ->
            if (source.text.contains('org.springframework.data.mongodb.')) {
                violations << "common-core depends on Mongo implementation: ${source}"
            }
        }
        ['authcenter', 'business', 'postmaster', 'postman'].each { moduleName ->
            fileTree("${moduleName}/src/main/java") { include '**/*.java' }.each { source ->
                def text = source.text
                if (text.contains('common.core.business.mongo.document.')
                        || text.contains('common.core.business.mongo.impl.')) {
                    violations << "feature imports business persistence type: ${source}"
                }
            }
        }
        fileTree('storage-business/src/main/java') { include '**/*.java' }.each { source ->
            if (source.text.contains('com.cheeseocean.im.authcenter.')
                    || source.text.contains('com.cheeseocean.im.business.service.')
                    || source.text.contains('com.cheeseocean.im.postmaster.')
                    || source.text.contains('com.cheeseocean.im.postman.')) {
                violations << "storage-business depends back on feature: ${source}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(violations.join(System.lineSeparator()))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBusinessStorageArchitectureBoundary')
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.google.protobuf'
    apply plugin: 'maven-publish'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.apache.dubbo:dubbo-dependencies-bom:${dubboVersion}"
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
        
        dependencies {
            // Dubbo依赖版本管理（确保版本解析正确）
            dependency "org.apache.dubbo:dubbo-spring-boot-starter:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-config-spring:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-rpc-dubbo:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-remoting-netty4:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-serialization-hessian2:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-registry-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-configcenter-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-metadata-report-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-registry-zookeeper:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-configcenter-zookeeper:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-metadata-report-zookeeper:${dubboVersion}"

            // 其他依赖版本管理
            dependency "org.apache.kafka:kafka-clients:${kafkaVersion}"
            dependency "org.projectlombok:lombok:${lombokVersion}"
            dependency "io.netty:netty-all:${nettyVersion}"
            dependency "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
            dependency "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            dependency "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            dependency "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
            dependency "org.slf4j:slf4j-api:${slf4jVersion}"
            dependency "ch.qos.logback:logback-classic:${logbackVersion}"
            dependency 'com.google.protobuf:protobuf-java:3.25.3'
            dependency 'com.google.protobuf:protobuf-java-util:3.25.3'
            dependency "com.alibaba.nacos:nacos-client:${nacosVersion}"
        }
    }

    configurations.all {
        resolutionStrategy {
            // protoc 与 runtime 必须全仓一致；覆盖 Firebase BOM 的 3.24.x 降级。
            force 'com.google.protobuf:protobuf-java:3.25.3'
            force 'com.google.protobuf:protobuf-java-util:3.25.3'
            // 强制使用特定版本解决冲突
            force "org.slf4j:slf4j-api:${slf4jVersion}"
            force "ch.qos.logback:logback-classic:${logbackVersion}"
            force "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            force "io.netty:netty-all:${nettyVersion}"
            
            // 缓存动态版本
            cacheDynamicVersionsFor 10, 'minutes'
            cacheChangingModulesFor 4, 'hours'
        }
        
        // 排除冲突依赖
        exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    }

    dependencies {
        constraints {
            implementation('com.google.protobuf:protobuf-java') {
                version { strictly '3.25.3' }
                because 'protoc 3.25.3 generated code requires the matching runtime across every module'
            }
            implementation('com.google.protobuf:protobuf-java-util') {
                version { strictly '3.25.3' }
                because 'Firebase must not downgrade the shared Protobuf runtime'
            }
        }
        // 测试依赖
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation "org.junit.jupiter:junit-jupiter"
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testCompileOnly "org.projectlombok:lombok"
        testAnnotationProcessor "org.projectlombok:lombok"

        // Lombok - 版本由dependencyManagement管理
        compileOnly "org.projectlombok:lombok"
        annotationProcessor "org.projectlombok:lombok"
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.25.3'
        }
    }

    tasks.named('processResources') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    sourceSets {
        main {
            proto {
                srcDir 'src/main/proto'
            }
        }
    }
    
    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
        jvmArgs += [
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                '--add-opens=java.base/java.math=ALL-UNNAMED',
                '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED'
        ]
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.named('compileJava') {
        dependsOn rootProject.tasks.named('verifyHistoryArchitectureBoundary')
        dependsOn rootProject.tasks.named('verifyQueueArchitectureBoundary')
        dependsOn rootProject.tasks.named('verifyBusinessStorageArchitectureBoundary')
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs += chronicleJvmArgs
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
    }
}
