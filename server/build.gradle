plugins {
    id 'java'
    id 'maven-publish'
    id 'org.graalvm.buildtools.native' version '0.10.1'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = project.findProperty('group') ?: 'com.cheeseocean.im'
    version = project.findProperty('version') ?: '1.0.0'
}

ext {
    chronicleJvmArgs = [
            '--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.math=ALL-UNNAMED'
    ]
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.apache.dubbo:dubbo-dependencies-bom:${dubboVersion}"
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
        
        dependencies {
            // Dubbo依赖版本管理（确保版本解析正确）
            dependency "org.apache.dubbo:dubbo-spring-boot-starter:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-config-spring:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-rpc-dubbo:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-remoting-netty4:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-serialization-hessian2:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-registry-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-configcenter-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-metadata-report-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-registry-zookeeper:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-configcenter-zookeeper:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-metadata-report-zookeeper:${dubboVersion}"

            // 其他依赖版本管理
            dependency "org.apache.kafka:kafka-clients:${kafkaVersion}"
            dependency "org.projectlombok:lombok:${lombokVersion}"
            dependency "io.netty:netty-all:${nettyVersion}"
            dependency "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
            dependency "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            dependency "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            dependency "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
            dependency "org.slf4j:slf4j-api:${slf4jVersion}"
            dependency "ch.qos.logback:logback-classic:${logbackVersion}"
            dependency "com.alibaba.nacos:nacos-client:${nacosVersion}"
            dependency "com.alicp.jetcache:jetcache-starter-redis-lettuce:${jetCacheVersion}"
        }
    }

    configurations.all {
        resolutionStrategy {
            // 强制使用特定版本解决冲突
            force "org.slf4j:slf4j-api:${slf4jVersion}"
            force "ch.qos.logback:logback-classic:${logbackVersion}"
            force "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            force "io.netty:netty-all:${nettyVersion}"
            
            // 缓存动态版本
            cacheDynamicVersionsFor 10, 'minutes'
            cacheChangingModulesFor 4, 'hours'
        }
        
        // 排除冲突依赖
        exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    }

    dependencies {
        // 测试依赖
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation "org.junit.jupiter:junit-jupiter"
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testCompileOnly "org.projectlombok:lombok"
        testAnnotationProcessor "org.projectlombok:lombok"

        // Spring Boot
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Redis
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

        // Kafka
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.apache.kafka:kafka-clients'

        // JSON处理
        implementation 'com.fasterxml.jackson.core:jackson-databind'
        implementation 'com.fasterxml.jackson.core:jackson-core'
        implementation 'com.fasterxml.jackson.core:jackson-annotations'
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        // 工具类
        implementation 'org.apache.commons:commons-lang3:3.18.0'

        implementation "com.alicp.jetcache:jetcache-starter-redis-lettuce"

        // RPC框架 (Dubbo)
        implementation 'org.apache.dubbo:dubbo-spring-boot-starter'
        implementation 'org.apache.dubbo:dubbo-registry-nacos'

        // Dubbo核心依赖 - 版本由BOM管理
        implementation "org.apache.dubbo:dubbo-config-spring"
        implementation "org.apache.dubbo:dubbo-rpc-dubbo"
        implementation("org.apache.dubbo:dubbo-remoting-netty4") {
            exclude group: 'io.netty', module: 'netty-transport-native-epoll'
            exclude group: 'io.netty', module: 'netty-transport-native-kqueue'
        }
        implementation "org.apache.dubbo:dubbo-serialization-hessian2"

        // Dubbo注册中心 - Nacos（推荐用于生产环境）
        implementation "org.apache.dubbo:dubbo-registry-nacos"
        implementation "org.apache.dubbo:dubbo-configcenter-nacos"
        implementation "org.apache.dubbo:dubbo-metadata-report-nacos"

        // JSON处理 - 版本由dependencyManagement管理
        implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
        implementation 'com.fasterxml.jackson.core:jackson-databind'
        implementation 'com.fasterxml.jackson.core:jackson-core'
        implementation 'com.fasterxml.jackson.core:jackson-annotations'

        // 日志框架 - 版本由dependencyManagement管理
        implementation "ch.qos.logback:logback-classic"
        implementation 'org.slf4j:log4j-over-slf4j'
        implementation 'org.slf4j:jcl-over-slf4j'

        // Lombok - 版本由dependencyManagement管理
        compileOnly "org.projectlombok:lombok"
        annotationProcessor "org.projectlombok:lombok"
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
        jvmArgs += [
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                '--add-opens=java.base/java.math=ALL-UNNAMED',
                '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED'
        ]
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs += chronicleJvmArgs
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
    }
}
