dependencies {
    implementation project(':common-api')
    // API 只复用 common-core port 与 infra-state 中的最小 Redis 幂等 adapter；传递依赖由本模块显式声明。
    implementation(project(':common-core')) {
        transitive = false
    }
    implementation(project(':infra-state')) {
        transitive = false
    }
    implementation project(':config')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.apache.dubbo:dubbo-spring-boot-starter'
    implementation 'org.apache.dubbo:dubbo-registry-nacos'

    // 仅用于校验 Controller JSON 字段与公共 proto descriptor 一致，不进入生产 runtime。
    testImplementation 'com.google.protobuf:protobuf-java:3.25.3'
}

springBoot {
    mainClass = 'com.cheeseocean.im.apiserver.ApiServerApplication'
}
