server:
  port: 0

spring:
  application:
    name: cheese-im-conversation-test
  
  # 使用嵌入式MongoDB进行测试
  data:
    mongodb:
      host: localhost
      port: 0
      database: test_cheese_im
  
  # 使用嵌入式Redis进行测试
  redis:
    host: localhost
    port: 0
    database: 0

# Dubbo配置 - 测试环境禁用
dubbo:
  application:
    name: cheese-im-conversation-test
  registry:
    address: N/A
  protocol:
    port: -1

# 日志配置
logging:
  level:
    com.cheeseocean.im.business.conversation: DEBUG
    org.springframework.data.mongodb: WARN
    org.apache.dubbo: WARN
    de.flapdoodle.embed: WARN

# CheeseIM配置
cheese:
  im:
    conversation:
      cache-expire-seconds: 60
      max-conversations-per-user: 100
      max-batch-size: 10
