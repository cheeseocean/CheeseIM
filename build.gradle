plugins {
    id 'java'
    id 'maven-publish'
    id 'org.graalvm.buildtools.native' version '0.10.1'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = project.findProperty('group') ?: 'com.cheeseocean.im'
    version = project.findProperty('version') ?: '1.0.0'

    repositories {
        // 优先使用阿里云镜像
        maven { 
            url 'https://maven.aliyun.com/repository/central'
            name 'Aliyun Central'
        }
        maven { 
            url 'https://maven.aliyun.com/repository/public'
            name 'Aliyun Public'
        }
        maven {
            url 'https://maven.aliyun.com/repository/spring'
            name 'Aliyun Spring'
        }
        maven {
            url 'https://maven.aliyun.com/repository/spring-plugin'
            name 'Aliyun Spring Plugin'
        }
        
        // Apache 仓库 - Dubbo 官方仓库
        maven {
            url 'https://repository.apache.org/content/repositories/releases/'
            name 'Apache Releases'
        }
        maven {
            url 'https://repository.apache.org/content/repositories/snapshots/'
            name 'Apache Snapshots'
        }
        
        // 本地仓库
        mavenLocal()
        
        // 中央仓库作为备用
        mavenCentral()
        
        // 私有仓库
        maven {
            url = uri("https://maven.pkg.github.com/cheeseocean/CheesePackages")
            name = 'GitHub Packages'
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.apache.dubbo:dubbo-dependencies-bom:${dubboVersion}"
        }
        
        dependencies {
            dependency "org.apache.dubbo:dubbo-config-spring:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-rpc-dubbo:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-remoting-netty4:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-serialization-hessian2:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-registry-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-configcenter-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-metadata-report-nacos:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-registry-zookeeper:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-configcenter-zookeeper:${dubboVersion}"
            dependency "org.apache.dubbo:dubbo-metadata-report-zookeeper:${dubboVersion}"
            
            dependency "org.apache.kafka:kafka-clients:${kafkaVersion}"
            dependency "org.projectlombok:lombok:${lombokVersion}"
            dependency "io.netty:netty-all:${nettyVersion}"

            dependency "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            dependency "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            dependency "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
            dependency "org.slf4j:slf4j-api:${slf4jVersion}"
            dependency "ch.qos.logback:logback-classic:${logbackVersion}"
            dependency "com.alibaba.nacos:nacos-client:${nacosVersion}"
        }
    }

    configurations.all {
        resolutionStrategy {
            // 强制使用特定版本解决冲突
            force "org.slf4j:slf4j-api:${slf4jVersion}"
            force "ch.qos.logback:logback-classic:${logbackVersion}"
            force "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            force "io.netty:netty-all:${nettyVersion}"
            
            // 缓存动态版本
            cacheDynamicVersionsFor 10, 'minutes'
            cacheChangingModulesFor 4, 'hours'
        }
        
        // 排除冲突依赖
        exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    }

    dependencies {
        // 测试依赖
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testCompileOnly "org.projectlombok:lombok"
        testAnnotationProcessor "org.projectlombok:lombok"

        // Dubbo核心依赖 - 使用明确版本
        implementation "org.apache.dubbo:dubbo-config-spring:${dubboVersion}"
        implementation "org.apache.dubbo:dubbo-rpc-dubbo:${dubboVersion}"
        implementation("org.apache.dubbo:dubbo-remoting-netty4:${dubboVersion}") {
            exclude group: 'io.netty', module: 'netty-transport-native-epoll'
            exclude group: 'io.netty', module: 'netty-transport-native-kqueue'
        }
        implementation "org.apache.dubbo:dubbo-serialization-hessian2:${dubboVersion}"
        
        // 注册中心 - Nacos
        implementation "org.apache.dubbo:dubbo-registry-nacos:${dubboVersion}"
        implementation "org.apache.dubbo:dubbo-configcenter-nacos:${dubboVersion}"
        implementation "org.apache.dubbo:dubbo-metadata-report-nacos:${dubboVersion}"
        
        // 注册中心 - Zookeeper
        implementation "org.apache.dubbo:dubbo-registry-zookeeper:${dubboVersion}"
        implementation "org.apache.dubbo:dubbo-configcenter-zookeeper:${dubboVersion}"
        implementation "org.apache.dubbo:dubbo-metadata-report-zookeeper:${dubboVersion}"

        // JSON处理
        implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
        
        // 日志框架
        implementation "ch.qos.logback:logback-classic:${logbackVersion}"
        implementation 'org.slf4j:log4j-over-slf4j'
        implementation 'org.slf4j:jcl-over-slf4j'

        // Lombok
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    }

    tasks.register('apiJar', Jar) {
        from(sourceSets.main.output) {
            include 'com/cheeseocean/im/*/api/**'
        }
        archiveClassifier = 'api'
    }

    tasks.register('apiSourceJar', Jar) {
        from(sourceSets.main.allSource) {
            include 'com/cheeseocean/im/*/api/**'
        }
        archiveClassifier = 'api-sources'
    }

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/cheeseocean/CheesePackages")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                    password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
                }
            }
        }
        publications {
            gpr(MavenPublication) {
                artifactId = "${project.name}-api"
                version = System.getProperty("api.version") ?: project.findProperty("${project.name}.api.version")
                artifact apiJar
                artifact apiSourceJar
                pom {
                    name = "CheeseIM ${project.name} API Jar"
                    description = "CheeseIM API dependencies"
                    url = "http://github.com/cheeseocean/CheeseIM"
                    licenses {
                        license {
                            name = "The Apache License, Version 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }
                    developers {
                        developer {
                            id = "xxxcrel"
                            name = "xxxcrel"
                            email = "xxxcrel@gmail.com"
                        }
                    }
                }
            }
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
    }
}