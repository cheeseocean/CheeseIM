nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  imagePullSecrets: []
  imageTag: "dev"
  imagePullPolicy: IfNotPresent
  springProfiles: "cluster,redis-cluster"
  nacos:
    serverAddr: "nacos:8848"
    namespace: "cheeseim"
    group: "DEFAULT_GROUP"
  kafka:
    bootstrapServers: "kafka:9092"
    autoCreateTopics: false
  redis:
    clusterNodes: "redis-cluster:6379"
    sentinelMaster: ""
    sentinelNodes: ""
  shutdownTimeout: "30s"
  podAnnotations: {}
  podLabels: {}

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}
    writerOldestAgeWarningMilliseconds: 5000
    writerOldestAgeCriticalMilliseconds: 30000

services:
  api-server:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/api-server
      digest: ""
    secretName: cheeseim-api-server-secrets
    ports:
      http: 18079
      management: 19079
    resources:
      requests: {cpu: 500m, memory: 768Mi}
      limits: {cpu: "2", memory: 1536Mi}
    terminationGracePeriodSeconds: 60
    preStopSeconds: 10
    pdb:
      enabled: true
      minAvailable: 2

  postoffice:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/postoffice
      digest: ""
    secretName: cheeseim-postoffice-secrets
    ports:
      websocket: 5147
      tcp: 5148
      dubbo: 20880
      management: 19080
    resources:
      requests: {cpu: "2", memory: 2Gi}
      limits: {cpu: "4", memory: 4Gi}
    terminationGracePeriodSeconds: 120
    preStopSeconds: 30
    pdb:
      enabled: true
      minAvailable: 2

  postmaster:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/postmaster
      digest: ""
    secretName: cheeseim-postmaster-secrets
    ports:
      dubbo: 20881
      management: 19081
    resources:
      requests: {cpu: "1", memory: 1536Mi}
      limits: {cpu: "4", memory: 3Gi}
    terminationGracePeriodSeconds: 120
    preStopSeconds: 15
    pdb:
      enabled: true
      minAvailable: 2

  postbox:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/postbox
      digest: ""
    secretName: cheeseim-postbox-secrets
    ports:
      dubbo: 20882
      management: 19082
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    terminationGracePeriodSeconds: 60
    preStopSeconds: 10
    pdb:
      enabled: true
      minAvailable: 2

  postman:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/postman
      digest: ""
    secretName: cheeseim-postman-secrets
    ports:
      dubbo: 20883
      management: 19083
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "4", memory: 4Gi}
    terminationGracePeriodSeconds: 60
    preStopSeconds: 10
    pdb:
      enabled: true
      minAvailable: 2

  authcenter:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/authcenter
      digest: ""
    secretName: cheeseim-authcenter-secrets
    ports:
      dubbo: 20884
      management: 19084
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    terminationGracePeriodSeconds: 60
    preStopSeconds: 10
    pdb:
      enabled: true
      minAvailable: 2

  business:
    enabled: true
    replicas: 3
    image:
      repository: cheeseim/business
      digest: ""
    secretName: cheeseim-business-secrets
    ports:
      http: 18085
      dubbo: 20885
      management: 19085
    resources:
      requests: {cpu: "1", memory: 1536Mi}
      limits: {cpu: "4", memory: 3Gi}
    terminationGracePeriodSeconds: 120
    preStopSeconds: 15
    pdb:
      enabled: true
      minAvailable: 2
